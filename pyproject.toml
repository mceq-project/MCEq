[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "MCEq"
version = "2.0.0"
description = "Numerical cascade equation solver"
readme = "README.md"
authors = [
  { name = "Anatoli Fedynitch", email = "afedynitch@gmail.com" },
  { name = "Stefan Fröse", email = "stefanfroese@as.edu.tw" },
]
license = { text = "BSD 3-Clause License" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
]

dependencies = [
    "h5py",
    "particletools",
    "crflux>1.0.5",
    "scipy",
    "numpy",
    "tqdm",
    "requests",
    "jacobi",
    "threadpoolctl",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=12.0.0"]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    # NRLMSIS 2.1 (pure-Python) so CI can exercise the opt-in MSIS21 atmosphere.
    "nrlmsis @ git+https://github.com/afedynitch/nrlmsis2.1",
]
lint = [
    # Layer contracts (.importlinter). 2.14 is the first release with
    # acyclic_siblings.
    "import-linter>=2.14",
]
notebooks = [
    # Executes docs/examples/ and examples/ as a pytest gate; see
    # .github/workflows/notebooks.yaml. nbmake already requires pytest and
    # ipykernel, but the gate forces `--nbmake-kernel=python3`, so the kernel
    # provider is a direct requirement of the invocation, not an accident of
    # nbmake's dependency tree.
    "nbmake>=1.5",
    "ipykernel",
    # Every example notebook imports pyplot, and matplotlib is not a runtime
    # dependency of MCEq.
    "matplotlib>=3.10",
]
docs = [
    # Core
    "sphinx>=8",
    # Third-party extensions
    "sphinx-automodapi>=0.2",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "nbsphinx>=0.9",
    "sphinx-gallery>=0.19",
    "pydata-sphinx-theme",
    # Helpful runtime deps for nbsphinx / gallery
    "ipython>=9",      # nicer notebook execution
    "matplotlib>=3.10", # common for gallery images
]


[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["mceq_config", "src/MCEq"]

[tool.setuptools.package-data]
"MCEq" = ["data/README.md", "data/DDM_1.0.npy"]

[project.urls]
Changelog = "https://mceq.readthedocs.io/en/latest/en/latest/changelog.html"
Documentation = "https://mceq.readthedocs.io/en/latest"
Homepage = "https://github.com/afedynitch/MCEq"
Issues = "https://github.com/afedynitch/MCEq/issues"

[tool.ruff]
# Notebooks are user-facing demonstrations, not library code, and one of them
# does not even parse as Python source. Excluded from both check and format.
exclude = ["docs/examples/**", "examples/**"]

[tool.ruff.lint]

extend-select = [
    "I", # enable isort
]

ignore = [
    "PLE1205", # Format check doesn't work with our custom logger
    "PLC0415", # Import should be at top of file
    "S101",    # Use of assert detected
    "PT011",   # Also about too plain exceptions
    "TRY003",  # I know my exception handling is bad
    "EM101", # Blocks literals in raises
    "PLR",  # Pylint stuff
    "RUF012", # Would require a lot of ClassVar's
]

[tool.ruff.format]
docstring-code-format = true

[tool.towncrier]
package="MCEq"
package_dir="src"
directory = "changes"
filename="CHANGELOG.md"
issue_format = "[#{issue}](https://github.com/mceq-project/MCEq/pull/{issue})"

[tool.towncrier.fragment.api]
name = "API Changes"

[tool.towncrier.fragment.bugfix]
name="Bug Fixes"

[tool.towncrier.fragment.chore]
name = "Maintencance"

[tool.towncrier.fragment.docs]
name = "Documentation Updates"

[tool.towncrier.fragment.feat]
name="New Features"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No addopts: the CI invocation in .github/workflows/_run_tests.yml passes its
# own -m/-n arguments, and an addopts marker expression would silently compose
# with them. golden_slow and golden_host are deselected by the root conftest
# instead.
markers = [
    "golden: regression against a stored golden section under tests/golden/data",
    "golden_slow: golden section costing minutes or a database CI does not carry (needs --run-golden-slow)",
    "golden_host: golden section pinned bitwise to the numpy/BLAS build of the host that generated it, compared on the reference job only (needs --run-golden-host)",
    "cuda: requires a usable CUDA device, not merely an importable cupy",
]

[tool.coverage.report]
exclude_lines = [
    "if config.enable_em:",
    "cuda",
    "CUDA",
    "cupy",
    "CuPy",
    "cusp",
    "cp\\.",
    "Cuda",
]

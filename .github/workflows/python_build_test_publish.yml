name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/python_build_test_publish.yml'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'src/**'

concurrency:
  # head_ref is empty for push and tag events, so without the run_id fallback
  # every push to main cancels the release run of the previous one.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  release_check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  # One Python per platform, ~2 min a job. Anything that breaks the toolchain on
  # a platform -- a compiler that is not found, a wheel the repair step refuses,
  # a deployment target that no longer matches the runner image -- fails here
  # instead of somewhere inside the 46-job release matrix. Runs on PRs that
  # touch the build, and gates `wheels` on push so a bad platform costs one
  # round of six jobs rather than the whole matrix.
  smoke:
    name: Wheel smoke test (Python 3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: "cp314-*"
          CIBW_SKIP: "*-musllinux* pp* *-win32 *-manylinux_i686"
          CIBW_TEST_COMMAND: "python -c \"import MCEq; print('MCEq imported successfully')\""
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_DEPENDENCY_VERSIONS: "pinned"
          CIBW_BUILD_VERBOSITY: 1

  wheels:
    name: Building Wheels
    needs: [release_check, smoke]
    if: needs.release_check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    # No wheel job in this matrix has ever needed more than ~2.5 min. Without a
    # bound, a runner that loses contact with the server (as macos-26-intel /
    # cp314 did in run 31360781445) sits on the 6 h default before failing.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-latest, windows-11-arm]
        py: [cp39, cp310, cp311, cp312, cp313, cp314]
        exclude:
          - os: windows-11-arm
            py: cp39
          - os: windows-11-arm
            py: cp310
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: ${{ matrix.py }}-*
          CIBW_SKIP: "*-musllinux* pp* *-win32 *-manylinux_i686"
          CIBW_TEST_REQUIRES: "pytest"
          # Windows-compatible test command using double quotes
          CIBW_TEST_COMMAND: "python -c \"import MCEq; print('MCEq imported successfully')\""
          CIBW_TEST_SKIP: "*-macosx_universal2:arm64"
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_DEPENDENCY_VERSIONS: "pinned"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.py }}-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    needs: release_check
    if: needs.release_check.outputs.should_release == 'true'
    name: source package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          # Debug: List content of dist directory
          ls -la dist/

      - name: Install and test sdist
        run: |
          # Install the built package directly from the dist directory
          python -m pip install --prefer-binary --verbose dist/*.tar.gz
          python -m pip install pytest

      - name: Test installed package
        run: |
          # Verify the package is installed and importable
          python -c "import MCEq; print('MCEq imported successfully')"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/MCEq/

    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/mceq-*"

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release_check, upload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.ref_name }}
          generate_release_notes: true

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  # Only changes that can break a wheel build: the build configuration and the
  # compiled sources. Pure-Python changes are covered by test.yaml.
  pull_request:
    paths:
      - '.github/workflows/python_build_test_publish.yml'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.cpp'

concurrency:
  # head_ref is empty for push and tag events, so without the run_id fallback
  # every push to main cancels the release run of the previous one.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  release_check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  # Pull requests that touch the build: one Linux wheel on the newest Python,
  # ~2 min. It catches a broken CMake/scikit-build-core configuration; the
  # per-platform toolchains are exercised by the test matrix (which compiles
  # the extensions on every image) and by `wheels` on main.
  smoke:
    name: Wheel smoke test (ubuntu-latest, cp314)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_BUILD: "cp314-*"
          CIBW_SKIP: "*-musllinux* pp* *-win32 *-manylinux_i686"
          CIBW_TEST_COMMAND: "python -c \"import MCEq; print('MCEq imported successfully')\""
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_DEPENDENCY_VERSIONS: "pinned"
          CIBW_BUILD_VERBOSITY: 1

  # One job per platform builds every CPython in turn, as cibuildwheel is meant
  # to be used: six jobs instead of a 29-job (platform x Python) matrix.
  wheels:
    name: Wheels (${{ matrix.os }})
    needs: release_check
    if: needs.release_check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    # One Python has never needed more than ~2.5 min; five in sequence fit
    # well inside this. Without a bound, a runner that loses contact with the
    # server (as macos-26-intel did in run 31360781445) sits on the 6 h
    # default before failing.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          # Windows on ARM has no CPython 3.10.
          CIBW_SKIP: "*-musllinux* pp* *-win32 *-manylinux_i686 cp310-win_arm64"
          # Windows-compatible test command using double quotes
          CIBW_TEST_COMMAND: "python -c \"import MCEq; print('MCEq imported successfully')\""
          CIBW_TEST_SKIP: "*-macosx_universal2:arm64"
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_DEPENDENCY_VERSIONS: "pinned"
          CIBW_BUILD_VERBOSITY: 1

      # One artifact per platform; `upload` merges every artifact into dist/.
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    needs: release_check
    if: needs.release_check.outputs.should_release == 'true'
    name: source package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          # Debug: List content of dist directory
          ls -la dist/

      - name: Install and test sdist
        run: |
          # Install the built package directly from the dist directory
          python -m pip install --prefer-binary --verbose dist/*.tar.gz
          python -m pip install pytest

      - name: Test installed package
        run: |
          # Verify the package is installed and importable
          python -c "import MCEq; print('MCEq imported successfully')"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/MCEq/

    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/mceq-*"

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release_check, upload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.ref_name }}
          generate_release_notes: true

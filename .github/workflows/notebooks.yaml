name: Notebooks

# Static gate for the marimo examples under examples/: `marimo check --strict`
# and the Jupyter-export tests (every example converts to a plain notebook
# without marimo). Executing the examples needs the full release databases
# (about 2 GB with the 2D packages) and minutes per notebook; that is
# scripts/build_examples.py, run where the data is, not on every PR.
#
# A separate workflow rather than a job in test.yaml: a notebook edit must not
# start the test matrix.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - examples/**
      - src/MCEq/notebook.py
      - scripts/build_examples.py
      - scripts/export_marimo.py
      - tests/test_notebook_export.py
      - pyproject.toml
      - .github/workflows/notebooks.yaml
  push:
    branches:
      - main

concurrency:
  # head_ref is empty for push events, so without the run_id fallback every
  # push to main cancels the previous run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: marimo check + export (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_SYSTEM_PYTHON: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: notebooks-ubuntu-latest-3.12
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requirements
        run: uv pip install -e . --group notebooks --group test

      - name: marimo check
        run: marimo check --strict examples/*/*.py

      - name: Jupyter export
        run: pytest -q tests/test_notebook_export.py

name: Notebooks

# Executes the example notebooks under docs/examples/ and examples/ with
# `pytest --nbmake`, so a notebook cannot silently rot against the library API.
#
# Eight of the twelve notebooks execute; four are `--ignore`d, one line each,
# for the honest per-notebook reasons tabulated above the pytest step (M15
# refreshed all twelve for v2 and re-measured each ignore; deleting an
# `--ignore` line is the whole change when a notebook becomes executable).
#
# A separate workflow rather than a job in test.yaml: the trigger differs. A
# notebook edit must not start the 40-job test matrix, and test.yaml's path
# filter would have to grow docs/examples/** for a job here to fire at all.
# One ubuntu job on one Python is enough -- the notebooks exercise no
# platform-specific code, and the wheel matrix already covers the build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/examples/**
      - examples/**
      - src/**
      - mceq_config/**
      - pyproject.toml
      - CMakeLists.txt
      - .github/workflows/notebooks.yaml
  push:
    branches:
      - main

concurrency:
  # head_ref is empty for push events, so without the run_id fallback every
  # push to main cancels the previous run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  nbmake:
    name: nbmake (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_SYSTEM_PYTHON: "true"
      # The notebooks call pyplot without selecting a backend.
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: notebooks-ubuntu-latest-3.12
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Editable so the notebooks import the checkout, and a real build because
      # density_profiles pulls in the compiled corsikaatm and nrlmsise00
      # extensions. No mkl: the executing notebooks solve with the default
      # explicit (euler) route, which needs no sparse backend.
      - name: Install requirements
        run: uv pip install -e . --group notebooks

      # Same assets, paths and cache key as _run_tests.yml, on purpose: the two
      # jobs then share one cache entry instead of each downloading the files.
      # The CI data packages: the v2 release data cut to the 31-bin test window
      # (891 GeV .. 891 TeV) and packaged like the release -- a base package
      # (FLUKA20251 + SIBYLL23E + spine), an extra-models package and the CI
      # manifest the loader resolves the other models through. The cache key
      # carries the manifest digest, so a new CI set invalidates the cache and
      # an unchanged one is a hit on every run (the "Report" step shows which).
      - name: Cache CI data packages
        id: cache-db
        uses: actions/cache@v6
        with:
          path: |
            src/MCEq/data/mceq_db_manifest_ci_v2.yaml
            src/MCEq/data/mceq_ci_base_air_1d_v2.h5
            src/MCEq/data/mceq_ci_extra_models_air_1d_v2.h5
          key: mceq-ci-data-v2-f13deaa1-${{ runner.os }}

      - name: Download CI data packages if not cached
        if: steps.cache-db.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for f in mceq_db_manifest_ci_v2.yaml mceq_ci_base_air_1d_v2.h5 mceq_ci_extra_models_air_1d_v2.h5; do
            curl -fsSL "https://github.com/mceq-project/MCEq/releases/download/ci-assets/$f" -o "src/MCEq/data/$f"
          done

      - name: Report CI data cache state and verify digests
        shell: bash
        run: |
          echo "cache-hit=${{ steps.cache-db.outputs.cache-hit }}"
          python - <<'PY'
          import hashlib, pathlib, sys, yaml
          data = pathlib.Path("src/MCEq/data")
          manifest = yaml.safe_load((data / "mceq_db_manifest_ci_v2.yaml").read_text())
          for name, entry in manifest["files"].items():
              digest = hashlib.sha256((data / name).read_bytes()).hexdigest()
              print(name, "OK" if digest == entry["sha256"] else "MISMATCH")
              if digest != entry["sha256"]:
                  sys.exit(1)
          PY

      # `--ignore` prunes a path before collection, so nbmake never opens the
      # ignored notebooks and a corrupted one would pass unnoticed. This step
      # covers all twelve -- it is the only thing the four ignored ones get.
      - name: Validate notebook JSON
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          import nbformat

          paths = sorted(pathlib.Path("docs/examples").glob("*.ipynb"))
          paths += sorted(pathlib.Path("examples").glob("*.ipynb"))
          if not paths:
              sys.exit("no notebooks found -- did a directory move?")
          bad = 0
          for path in paths:
              try:
                  nbformat.validate(nbformat.read(path, as_version=4))
              except Exception as exc:
                  bad += 1
                  print(f"INVALID {path}: {type(exc).__name__}: {exc}")
          print(f"{len(paths) - bad}/{len(paths)} notebooks valid")
          sys.exit(bad != 0)
          PY

      # Notebooks that want the cached data set `config.mceq_db_fname`
      # themselves; without it MCEq downloads the default database.
      #
      # The four ignored notebooks below need models or data CI does not
      # carry:
      #   Muon spectra                 6 of its 8 models are in no shipped DB
      #   Partial_hadron_contribution  needs CRFluxModels and set_obs_particles,
      #                                both removed in v2
      #   Full_sky_carousel            SIBYLL23D, and gtracr 2.0.0 breaks the
      #                                geomagnetic cutoff adapter
      #   Angular_shower_development   needs the 2D URQMD FLUKA DB, which is
      #                                not redistributable
      - name: Execute notebooks
        run: |
          pytest --nbmake --nbmake-kernel=python3 docs/examples examples \
            --ignore="docs/examples/Full_sky_carousel.ipynb" \
            --ignore="docs/examples/Muon spectra.ipynb" \
            --ignore="docs/examples/Partial_hadron_contribution.ipynb" \
            --ignore="examples/Angular_shower_development.ipynb"

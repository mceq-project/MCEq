name: Release bundle validation

# Downloads ~1 GB of release data, so it runs only on the way to PyPI:
# the release tag, or by hand. Never on pull requests.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Draft releases require repository push access. The token is exposed only
    # to the download step; checkout does not persist credentials.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install candidate
        run: uv pip install --system . pytest
      # Keyed by the manifest digest: a new data release misses, an
      # unchanged one hits.
      - name: Cache release packages
        id: cache-bundles
        uses: actions/cache@v6
        with:
          path: bundles
          key: mceq-release-packages-9f12d4a5-${{ runner.os }}
      - name: Download draft bundles
        if: steps.cache-bundles.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundles
          # The SIBYLL23E 2D model file is left out on purpose: the 2D test
          # lets the loader fetch it, which exercises the manifest lookup.
          gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" --dir bundles \
            --pattern 'mceq_db_manifest_v2.yaml' \
            --pattern 'mceq_base_air_1d_v2.h5*' \
            --pattern 'mceq_extra_models_air_1d_v2.h5*' \
            --pattern 'mceq_base_air_2d_v2.h5*' \
            --pattern 'mceq_base_air_2d_rc7_v2.h5*'
          cd bundles
          sha256sum --check ./*.sha256
      - name: Report cache state and verify digests
        run: |
          echo "cache-hit=${{ steps.cache-bundles.outputs.cache-hit }}"
          cd bundles && ls -l && sha256sum --check ./*.sha256
      - name: Test installed candidate against the 1D packages
        env:
          MCEQ_RELEASE_BUNDLES: ${{ github.workspace }}/bundles
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q --confcutdir=tests/release_bundles tests/release_bundles -k 'not 2d'
      - name: Test installed candidate against the 2D packages
        env:
          MCEQ_RELEASE_BUNDLES: ${{ github.workspace }}/bundles
          GH_TOKEN: ${{ github.token }}
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q --confcutdir=tests/release_bundles tests/release_bundles -k 2d

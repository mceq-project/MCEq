name: Release bundle validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release_bundles.yaml
      - tests/release_bundles/**

jobs:
  bundles:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Draft releases require repository push access. The token is exposed only
    # to the download step; checkout does not persist credentials.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install candidate
        run: uv pip install --system . pytest
      - name: Download draft bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundles
          gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" --dir bundles --pattern '*v2.0.0-rc2*'
          cd bundles
          sha256sum --check ./*.sha256
      - name: Test installed candidate against 1D bundles
        env:
          MCEQ_RELEASE_BUNDLES: ${{ github.workspace }}/bundles
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q --confcutdir=tests/release_bundles tests/release_bundles -k 'not 2d'
      - name: Test installed candidate against the 2D bundle
        env:
          MCEQ_RELEASE_BUNDLES: ${{ github.workspace }}/bundles
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q --confcutdir=tests/release_bundles tests/release_bundles -k 2d

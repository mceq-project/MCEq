name: Run test suite

# Single definition of "install MCEq and run the test suite on one platform",
# called by test.yaml for both the quick gate and the full matrix so the two
# cannot drift apart.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      upload-coverage:
        required: false
        default: false
        type: boolean
      # The golden sections in tests/golden/__init__.py HOST_SECTIONS are
      # bitwise against the numpy/BLAS build that generated them, so exactly
      # one caller sets this; everywhere else they skip.
      golden-host:
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ${{ inputs.os }}
    env:
      UV_SYSTEM_PYTHON: "true"
      # Host goldens were generated on x86-v3. Hosted runners can also
      # expose AVX-512, whose NumPy transcendental loops round differently.
      NPY_DISABLE_CPU_FEATURES: ${{ inputs.golden-host && 'X86_V4,AVX512_ICL,AVX512_SPR' || '' }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: False
        fetch-depth: 3
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: test-${{ inputs.os }}-${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true
    - name: Install requirements
      run: uv pip install -e . --group test ${{ (runner.os != 'macOS' && runner.arch != 'ARM64') && 'mkl' || '' }} ${{ inputs.golden-host && 'numpy==2.5.2 scipy==1.18.0' || '' }}
    - name: Record reference numerical runtime
      if: inputs.golden-host
      run: python -c "import numpy; import scipy; print(numpy.__version__, scipy.__version__); numpy.show_runtime()"
    - name: Check MKL version
      if: runner.os != 'macOS' && runner.arch != 'ARM64'
      run: pip show mkl
    # The CI data packages: the v2 release data cut to the 31-bin test window
    # (891 GeV .. 891 TeV) and packaged like the release -- a base package
    # (FLUKA20251 + SIBYLL23E + spine), an extra-models package and the CI
    # manifest the loader resolves the other models through. The cache key
    # carries the manifest digest, so a new CI set invalidates the cache and
    # an unchanged one is a hit on every run (the "Report" step shows which).
    - name: Cache CI data packages
      id: cache-db
      uses: actions/cache@v6
      with:
        path: |
          src/MCEq/data/mceq_db_manifest_ci_v2.yaml
          src/MCEq/data/mceq_ci_base_air_1d_v2.h5
          src/MCEq/data/mceq_ci_extra_models_air_1d_v2.h5
        key: mceq-ci-data-v2-f13deaa1-${{ runner.os }}

    - name: Download CI data packages if not cached
      if: steps.cache-db.outputs.cache-hit != 'true'
      shell: bash
      run: |
        for f in mceq_db_manifest_ci_v2.yaml mceq_ci_base_air_1d_v2.h5 mceq_ci_extra_models_air_1d_v2.h5; do
          curl -fsSL "https://github.com/mceq-project/MCEq/releases/download/ci-assets/$f" -o "src/MCEq/data/$f"
        done

    - name: Report CI data cache state and verify digests
      shell: bash
      run: |
        echo "cache-hit=${{ steps.cache-db.outputs.cache-hit }}"
        python - <<'PY'
        import hashlib, pathlib, sys, yaml
        data = pathlib.Path("src/MCEq/data")
        manifest = yaml.safe_load((data / "mceq_db_manifest_ci_v2.yaml").read_text())
        for name, entry in manifest["files"].items():
            digest = hashlib.sha256((data / name).read_bytes()).hexdigest()
            print(name, "OK" if digest == entry["sha256"] else "MISMATCH")
            if digest != entry["sha256"]:
                sys.exit(1)
        PY
    - name: Run tests
      run: pytest --cov=MCEq --cov-branch --cov-report=xml -n 3 --dist loadgroup ${{ inputs.golden-host && '--run-golden-host' || '' }}
    - name: Upload coverage reports to Codecov
      if: inputs.upload-coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ inputs.os }}

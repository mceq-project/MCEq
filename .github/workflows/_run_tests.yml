name: Run test suite

# Single definition of "install MCEq and run the test suite on one platform",
# called by test.yaml for both the quick gate and the full matrix so the two
# cannot drift apart.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      upload-coverage:
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ${{ inputs.os }}
    env:
      UV_SYSTEM_PYTHON: "true"
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: False
        fetch-depth: 3
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: test-${{ inputs.os }}-${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true
    - name: Install requirements
      run: uv pip install -e . --group test ${{ (runner.os != 'macOS' && runner.arch != 'ARM64') && 'mkl' || '' }}
    - name: Check MKL version
      if: runner.os != 'macOS' && runner.arch != 'ARM64'
      run: pip show mkl
    # The v2 data cut to the 31-bin test window (891 GeV .. 891 TeV) and the
    # stored 2D solution, pinned in tests/data/ci_assets.py and
    # baseline_asset.py; the cache key is their hash, so a new pin misses.
    - name: Cache CI data packages
      id: cache-db
      uses: actions/cache@v6
      with:
        path: |
          tests/data/2d_baseline_solution.npz
          src/MCEq/data/mceq_db_manifest_ci_v2.yaml
          src/MCEq/data/mceq_ci_base_air_1d_v2.h5
          src/MCEq/data/mceq_ci_extra_models_air_1d_v2.h5
          src/MCEq/data/mceq_ci_base_air_2d_legendre_v2.h5
        key: mceq-ci-data-${{ hashFiles('tests/data/ci_assets.py', 'tests/data/baseline_asset.py') }}-${{ runner.os }}

    # Verifies a cache hit against the pins and fetches what is missing.
    - name: Fetch and verify CI data
      shell: bash
      run: |
        echo "cache-hit=${{ steps.cache-db.outputs.cache-hit }}"
        python tests/data/ci_assets.py
        python tests/data/baseline_asset.py
    - name: Run tests
      run: pytest --cov=MCEq --cov-branch --cov-report=xml -n 3 --dist loadgroup
    - name: Upload coverage reports to Codecov
      if: inputs.upload-coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ inputs.os }}
